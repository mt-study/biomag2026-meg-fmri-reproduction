project_dir: /gpfs/userdata/ldeng/Speech-BCI/biomag2026/0907/meg_fmri_clip_cc_0907

data:
  fmri_root: /gpfs/userdata/ldeng/dataset/speech/fMRI/ds003643-download
  meg_root: /gpfs/userdata/ldeng/dataset/speech/MEG/lpp_data_challenge
  language: CN
  text_information_csv: /gpfs/userdata/ldeng/dataset/speech/fMRI/ds003643-download/annotation/CN/lppCN_word_information.csv
  text_embedding_csv: /gpfs/userdata/ldeng/dataset/speech/fMRI/ds003643-download/annotation/CN/lppCN_word_embeddings_BERT.csv
  window_cache: cache/windows_subject_pairs

alignment:
  window_seconds: 2
  fmri_delay_seconds: [2, 4, 6, 8]
  fmri_tr_seconds: 2
  train_sections: [1, 2, 3, 4, 5, 6, 7]
  val_sections: [8, 9]

sampling:
  window_cache_mode: subject_pair_exhaustive
  enumerate_all_subject_pairs: true
  # Match the task-1529545-aligned new benchmark.
  noise_std: 0.1

model:
  embedding_dim: 256
  dropout: 0.3
  meg_hidden_channels: 128
  fmri_hidden_dim: 512
  text_hidden_dim: 512
  use_joint: true
  # Match the original exhaustive MLP fusion head exactly.
  joint_hidden_dim: 512
  fusion_mode: mlp
  # Every fusion seed loads this one fixed new-benchmark encoder checkpoint.
  init_from: checkpoints/unified_benchmark_task1529545_matched/all_subjects/exhaustive/seed_42/encoder_best.pt
  freeze_encoders: true

training:
  # Keep the new benchmark schedule while restoring the old MLP capacity.
  base_window_batch_size: 64
  eval_base_window_batch_size: 16
  eval_pair_chunk_size: 8
  epochs: 60
  learning_rate: 0.0003
  weight_decay: 0.01
  lambda_mf: 1.0
  lambda_jt: 1.0
  # Explicitly record the objective already used by the completed frozen run.
  objective: joint_text_only
  seed: 42
  num_workers: 4
  checkpoint_dir: checkpoints/unified_fixed_encoder_legacy_mlp/s42

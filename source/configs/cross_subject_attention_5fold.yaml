project_dir: /gpfs/userdata/ldeng/Speech-BCI/biomag2026/0907/meg_fmri_clip_cc_0907

data:
  window_cache: cache/windows_subject_pairs

cross_subject:
  n_folds: 5
  train_sections: [1, 2, 3, 4, 5, 6]
  val_sections: [7]
  test_sections: [8, 9]

model:
  embedding_dim: 256
  dropout: 0.3
  meg_hidden_channels: 128
  fmri_hidden_dim: 512
  text_hidden_dim: 512
  joint_hidden_dim: 64
  fusion_mode: attention

training:
  base_window_batch_size: 32
  eval_base_window_batch_size: 16
  eval_pair_chunk_size: 8
  fusion_epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.01
  lambda_mf: 1.0
  lambda_jt: 1.0
  seed: 42
  num_workers: 2

input:
  encoder_checkpoint_root: checkpoints/cross_subject_5fold
  reference_result_root: results/cross_subject_5fold

output:
  checkpoint_root: checkpoints/cross_subject_attention_5fold
  result_root: results/cross_subject_attention_5fold

project_dir: /gpfs/userdata/ldeng/Speech-BCI/biomag2026/0907/meg_fmri_clip_cc_0907

experiment:
  name: temporal_window_fmri_delay_ablation_v1
  comparison: full_subject_exhaustive
  seeds: [42, 43, 44]

data:
  # Slurm overrides this per condition; delay-only conditions reuse w2_dall.
  window_cache: cache/temporal_ablation/w2_dall

protocol:
  train_sections: [1, 2, 3, 4, 5, 6, 7]
  test_sections: [8, 9]
  n_subject_folds: 5

sampling:
  # Match task 1529545 and the completed unified benchmark.
  noise_std: 0.1

model:
  embedding_dim: 256
  dropout: 0.3
  meg_hidden_channels: 128
  fmri_hidden_dim: 512
  text_hidden_dim: 512
  # Match the completed frozen legacy MLP exactly.
  fusion_hidden_dims:
    mlp: 512

training:
  base_window_batch_size: 64
  eval_base_window_batch_size: 16
  eval_pair_chunk_size: 8
  drop_last: true
  encoder_epochs: 60
  fusion_epochs: 60
  learning_rate: 0.0003
  weight_decay: 0.01
  lambda_mf: 1.0
  lambda_jt: 1.0
  num_workers: 4
  checkpoint_selection: validation_best
  # Train the three encoders first, freeze the selected checkpoint, then fit
  # only the legacy 512-hidden MLP head.
  fusion_modes: [mlp]

evaluation:
  random_repeats: 2000

output:
  checkpoint_root: checkpoints/temporal_ablation
  result_root: results/temporal_ablation
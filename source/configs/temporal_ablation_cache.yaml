project_dir: /gpfs/userdata/ldeng/Speech-BCI/biomag2026/0907/meg_fmri_clip_cc_0907

data:
  fmri_root: /gpfs/userdata/ldeng/dataset/speech/fMRI/ds003643-download
  meg_root: /gpfs/userdata/ldeng/dataset/speech/MEG/lpp_data_challenge
  language: CN
  text_information_csv: /gpfs/userdata/ldeng/dataset/speech/fMRI/ds003643-download/annotation/CN/lppCN_word_information.csv
  text_embedding_csv: /gpfs/userdata/ldeng/dataset/speech/fMRI/ds003643-download/annotation/CN/lppCN_word_embeddings_BERT.csv
  meg_unified_cache: cache/meg_unified
  fmri_pooled_cache: cache/fmri_pooled
  text_embedding_cache: cache/text/lppCN_bert_embeddings.npy
  # Slurm overrides this for w1_dall, w2_dall, and w4_dall.
  window_cache: cache/temporal_ablation/w2_dall

meg_preprocessing:
  pick_types: [mag, grad]
  highpass_hz: 0.1
  lowpass_hz: 40.0
  resample_hz: 100.0
  epoch_tmin_seconds: -0.1

alignment:
  # Slurm overrides only the measured window length.
  window_seconds: 2
  fmri_delay_seconds: [2, 4, 6, 8]
  fmri_tr_seconds: 2
  train_sections: [1, 2, 3, 4, 5, 6, 7]
  val_sections: [8, 9]
  # Keep the candidate grid and end boundary identical for every condition.
  stride_seconds: 4
  grid_window_bound_seconds: 4
  grid_delay_bound_seconds: 8
  # Candidate inclusion is based on the same 1 s annotation interval.
  grid_text_presence_seconds: 1

normalization:
  fmri_per_voxel_zscore: true
  meg_per_channel_zscore: true
  text_mean_center: true

sampling:
  window_cache_mode: subject_pair
  noise_std: 0.0
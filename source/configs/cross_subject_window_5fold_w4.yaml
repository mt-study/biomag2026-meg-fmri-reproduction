project_dir: /gpfs/userdata/ldeng/Speech-BCI/biomag2026/0907/meg_fmri_clip_cc_0907

# Strict unseen-subject 5-fold at a 4 s MEG and text window.
# Everything except the temporal window matches configs/cross_subject_5fold.yaml
# so this condition stays comparable with results/cross_subject_5fold.
data:
  # Shared cache: 8 s MEG rows plus one text feature file per window length.
  window_cache: cache/meg_text_window_ablation/shared_w8
  window_subset_seconds: 4

cross_subject:
  n_folds: 5
  train_sections: [1, 2, 3, 4, 5, 6]
  val_sections: [7]
  test_sections: [8, 9]

model:
  embedding_dim: 256
  dropout: 0.3
  meg_hidden_channels: 128
  fmri_hidden_dim: 512
  text_hidden_dim: 512
  joint_hidden_dim: 512
  fusion_mode: mlp
  # Hold the encoder parameter count identical across window lengths, exactly
  # as configs/meg_text_window_ablation.yaml does.
  meg_temporal_bins: 25

training:
  base_window_batch_size: 32
  eval_base_window_batch_size: 16
  eval_pair_chunk_size: 8
  encoder_epochs: 20
  fusion_epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.01
  lambda_mf: 1.0
  lambda_jt: 1.0
  seed: 42
  num_workers: 2

output:
  checkpoint_root: checkpoints/cross_subject_window_5fold/w4
  result_root: results/cross_subject_window_5fold/w4
